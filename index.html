
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой ИИ-помощник</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 600px;
      margin: auto;
      padding: 24px 16px;
    }
    h1 { font-size: 28px; }
    p { color: #b7bac4; }
    #chat {
      min-height: 250px;
      padding: 16px;
      border-radius: 16px;
      background: #1c1e24;
      margin: 20px 0;
    }
    input, button {
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }
    input {
      width: 100%;
      background: #292c34;
      color: white;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: #ffffff;
      color: #111111;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>✦ Мой ИИ-помощник</h1>
    <p>Твой личный помощник в одном приложении.</p>
    <div id="chat">
      <strong>Помощник</strong>
      <p>Привет! Скоро мы подключим настоящий искусственный интеллект.</p>
    </div>
    <input id="question" placeholder="Напиши своё сообщение...">
    <button onclick="sendMessage()">Отправить</button>
  </main>
  <script>
    function sendMessage() {
      const input = document.getElementById('question');
      const chat = document.getElementById('chat');
      const question = input.value.trim();
      if (!question) return;

      const message = document.createElement('p');
      message.textContent = 'Ты: ' + question;
      chat.appendChild(message);

      const reply = document.createElement('p');
      reply.textContent =
        'Сообщение принято! Настоящий ИИ подключим на следующем этапе.';
      chat.appendChild(reply);

      input.value = '';
    }
  </script>
</body>
</html>
